name: CI
on:
  push:
    branches: [main, 'revision/**']
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Run all platforms or one targeted compatibility check
        type: choice
        default: all
        options: [all, ubuntu-latest, windows-latest, macos-15, macos-26, macos-15-intel, xcode-27]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true
env:
  COMPANION_REF: 10272236a00b4c4dac8bc788ae3b14a2efa55ca3
jobs:
  distribution:
    name: Build and check distributions once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build and check package
        run: |
          python -m pip install build twine ruff==0.12.0
          python -m build --outdir "${{ runner.temp }}/dist"
          python -m twine check "${{ runner.temp }}"/dist/*
          python -m ruff check --no-cache src scripts tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: distributions
          path: ${{ runner.temp }}/dist/*
          retention-days: 7
  compatibility:
    name: Install, test, build, render / ${{ matrix.os }}
    needs: distribution
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform != '' && inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["ubuntu-latest", "windows-latest", "macos-15", "macos-26", "macos-15-intel", "xcode-27"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: package
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: itsuzef/vst-bench-dataset-host-public
          ref: ${{ env.COMPANION_REF }}
          path: companion
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: distributions
          path: ${{ runner.temp }}/dist
      - name: Install interpreter provisioning tool
        run: python -m pip install uv
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcb-util-dev libxcb-cursor-dev libxkbcommon-x11-dev
      - name: Build native host and fixture once
        run: |
          cmake -S companion -B "$RUNNER_TEMP/native" -DCMAKE_BUILD_TYPE=Release -DSMTG_CREATE_PLUGIN_LINK=OFF 2>&1 | tee "$RUNNER_TEMP/native-build.log"
          cmake --build "$RUNNER_TEMP/native" --config Release --target MethodFixture method_fixture_runner --parallel 4 2>&1 | tee -a "$RUNNER_TEMP/native-build.log"
      - name: Check installation, package tests, rendering, and verification on Python 3.11–3.15
        run: |
          python package/scripts/check_compatibility.py \
            --package-repo package --companion-repo companion \
            --build-dir "$RUNNER_TEMP/native" \
            --wheel "$RUNNER_TEMP"/dist/*.whl \
            --work-dir "$RUNNER_TEMP/compatibility-results"
      - name: Preserve platform evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compatibility-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/native-build.log
            ${{ runner.temp }}/compatibility-results/summary.json
            ${{ runner.temp }}/compatibility-results/*/result.json
            ${{ runner.temp }}/compatibility-results/*/logs
            ${{ runner.temp }}/compatibility-results/*/dataset
          retention-days: 7
  locked-environment:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all'
    name: Historical dependency lock / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-26]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install build and validation tools
        run: |
          python -m pip install --require-hashes -r requirements/lock.txt
          python -m pip install build twine
      - name: Build and install distribution
        run: |
          python -m build --no-isolation --outdir "${{ runner.temp }}/dist"
          python -m twine check "${{ runner.temp }}"/dist/*
          python -m pip install --no-deps "${{ runner.temp }}"/dist/*.whl
      - name: Check installed package
        run: |
          python -B -m pytest -p no:cacheprovider -q
          python -m ruff check --no-cache src scripts tests
          vst-bench-ml --help
          python -c "import importlib.metadata, vst_bench_ml; assert vst_bench_ml.__version__ == importlib.metadata.version('vst-bench-ml')"
