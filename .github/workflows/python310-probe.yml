name: Python 3.10 feasibility (not supported range)
on:
  push:
    branches: ['revision/installation-compatibility']
    paths:
      - '.github/workflows/python310-probe.yml'
      - 'scripts/prepare_python310_probe.py'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-26, macos-15-intel, xcode-27]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: package
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: itsuzef/vst-bench-dataset-host-public
          ref: 9d351c95928a990338296eefc35eff8494256602
          path: companion
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Build test-only candidate on Python 3.10
        run: |
          python -m pip install build twine uv
          python package/scripts/prepare_python310_probe.py "$RUNNER_TEMP/candidate"
          python -m build "$RUNNER_TEMP/candidate" --outdir "$RUNNER_TEMP/dist"
          python -m twine check "$RUNNER_TEMP"/dist/*
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcb-util-dev libxcb-cursor-dev libxkbcommon-x11-dev
      - name: Build native fixture and host
        run: |
          set -o pipefail
          cmake -S companion -B "$RUNNER_TEMP/native" -DCMAKE_BUILD_TYPE=Release -DSMTG_CREATE_PLUGIN_LINK=OFF 2>&1 | tee "$RUNNER_TEMP/native-build.log"
          cmake --build "$RUNNER_TEMP/native" --config Release --target MethodFixture method_fixture_runner --parallel 4 2>&1 | tee -a "$RUNNER_TEMP/native-build.log"
      - name: Clean Python 3.10 install, tests, native render and verify
        run: |
          python package/scripts/check_compatibility.py --versions 3.10 \
            --package-repo package --companion-repo companion \
            --build-dir "$RUNNER_TEMP/native" --wheel "$RUNNER_TEMP"/dist/*.whl \
            --work-dir "$RUNNER_TEMP/probe-results"
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python310-${{ matrix.os }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/candidate.json
            ${{ runner.temp }}/dist/*
            ${{ runner.temp }}/native-build.log
            ${{ runner.temp }}/probe-results/summary.json
            ${{ runner.temp }}/probe-results/*/result.json
            ${{ runner.temp }}/probe-results/*/logs
            ${{ runner.temp }}/probe-results/*/dataset
